name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry on version tags.
# Auth: GitHub OIDC (namespace io.github.rwaldman/*).
# Docs: https://modelcontextprotocol.io/registry/github-actions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only (do not publish)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --help

      - name: Align server.json version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! command -v jq >/dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "Publishing version $VERSION"
          cat server.json

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Authenticate (GitHub OIDC)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: mcp-publisher login github-oidc

      - name: Publish
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: mcp-publisher publish

      - name: Verify registry listing
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          sleep 2
          curl -fsSL "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.rwaldman/agentbits" \
            | tee /tmp/registry.json
          grep -q 'io.github.rwaldman/agentbits' /tmp/registry.json
